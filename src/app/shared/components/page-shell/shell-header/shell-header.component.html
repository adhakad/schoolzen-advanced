<!-- The reference's `.topbar`: crumb left, session pill + notification bell + profile
     dropdown right. Sits INSIDE .main, beside the full-height sidebar — not above it.
     docs/schoolzen-planning/v1/academic-setup/classes-sections.html -->
<div class="topbar">
  <div class="crumb-left">
    <button type="button" class="hamburger" aria-label="Open menu" (click)="menuToggled.emit()">
      <i class="bi bi-list"></i>
    </button>
    <div class="crumb" *ngIf="crumb">
      <ng-container *ngIf="crumb.group">{{ crumb.group }} / </ng-container><b>{{ crumb.page }}</b>
    </div>
  </div>

  <div class="top-actions">
    <!-- Always rendered once there is a context. It used to be gated on the session LIST
         being non-empty, so on any database where /v1/academic-session answers nothing the
         selector vanished from every page in the app rather than showing the one session
         it does know about. ShellContextService now always supplies at least that. -->
    <app-dd class="year-pill" *ngIf="context"
            [pill]="false"
            [showChevron]="false"
            triggerIcon="calendar-event"
            menuAlign="left"
            [fullWidth]="false"
            ariaLabel="Academic session"
            [options]="sessionOptions"
            [value]="context.activeSession"
            (valueChange)="onSessionChange($event)"></app-dd>

    <div class="dd" [class.open]="bellOpen">
      <button type="button" class="bell dd-trigger" aria-label="Notifications"
              [attr.aria-expanded]="bellOpen" (click)="toggleBell($event)">
        <i class="bi bi-bell"></i><span class="bell-dot" *ngIf="hasUnread"></span>
      </button>
      <div class="dd-menu">
        <div class="notif-row" *ngFor="let notification of notifications; trackBy: trackById">
          <span class="notif-title">{{ notification.text }}</span>
          <span class="notif-meta">{{ notification.time }}</span>
        </div>
        <div class="notif-empty" *ngIf="!notifications.length">Nothing new right now.</div>
      </div>
    </div>

    <div class="dd" [class.open]="profileOpen">
      <div class="profile dd-trigger" role="button" tabindex="0"
           [attr.aria-expanded]="profileOpen"
           (click)="toggleProfile($event)" (keydown.enter)="toggleProfile($event)">
        <div class="avatar">{{ context?.initials }}</div>
        <span class="profile-name">{{ context?.displayName }}</span>
        <i class="bi bi-chevron-down chevron"></i>
      </div>

      <div class="dd-menu">
        <!-- The school identity block above the menu items — never dropped. -->
        <div class="drop-school" *ngIf="context?.school as school">
          <img class="drop-school-logo" *ngIf="school.logoUrl" [src]="school.logoUrl" [alt]="school.name" />
          <div class="drop-school-logo" *ngIf="!school.logoUrl">{{ school.initials }}</div>
          <div>
            <div class="drop-school-name">{{ school.name }}</div>
            <div class="drop-school-meta">{{ school.meta }}</div>
          </div>
        </div>
        <div class="dd-option"><i class="bi bi-person"></i>My Profile</div>
        <!-- Admin only, matching the legacy teacher header having no profile menu at all. -->
        <div class="dd-option" *ngIf="context?.role === 'admin'"><i class="bi bi-gear"></i>School Settings</div>
        <div class="dd-divider"></div>
        <div class="dd-option danger" (click)="loggedOut.emit()">
          <i class="bi bi-box-arrow-right"></i>Logout
        </div>
      </div>
    </div>
  </div>
</div>
