<div class="sw-header">
  <div class="sw-left">
    <button type="button" class="hamburger-btn" aria-label="Open menu" (click)="menuToggled.emit()">
      <i class="ti ti-menu-2"></i>
    </button>
    <div class="sw-brand">
      <div class="sw-brand-mark">S</div>
      <span class="sw-brand-name">Schoolzen</span>
    </div>
  </div>

  <div class="sw-right">
    <div class="sw-session" *ngIf="context && context.sessions.length">
      <i class="ti ti-calendar-event"></i>
      <!-- Same Material control as the toolbar's filter pills, re-themed to the header's
           999px session pill; Material's field chrome is never rendered. -->
      <mat-select class="sw-pill-control" panelClass="sw-select-panel" disableRipple
                  aria-label="Academic session"
                  [value]="context.activeSession"
                  (selectionChange)="onSessionChange($event.value)">
        <mat-option *ngFor="let session of context.sessions; trackBy: trackBySession" [value]="session">
          {{ session }}
        </mat-option>
      </mat-select>
    </div>

    <button type="button" class="sw-bell" aria-label="Notifications" (click)="toggleBell()">
      <i class="ti ti-bell"></i><span class="bell-badge" *ngIf="hasUnread"></span>
    </button>

    <button type="button" class="sw-profile" (click)="toggleProfile()">
      <span class="sw-avatar">{{ context?.initials }}</span>
      <span class="sw-profile-name">{{ context?.displayName }}</span>
      <i class="ti ti-chevron-down" style="font-size:12px;color:#b0b0c9;"></i>
    </button>
  </div>
</div>

<div class="sw-bell-drop" *ngIf="bellOpen">
  <div class="bell-drop-title">Notifications</div>
  <div class="bell-item" *ngFor="let notification of notifications; trackBy: trackById">
    <span class="bi-dot" [class.read]="!notification.unread"></span>
    <div>
      <div class="bi-text">{{ notification.text }}</div>
      <div class="bi-time">{{ notification.time }}</div>
    </div>
  </div>
  <div class="bell-empty" *ngIf="!notifications.length">Nothing new right now.</div>
  <button type="button" class="bell-view-all">View all notifications</button>
</div>

<div class="sw-profile-drop" *ngIf="profileOpen">
  <div class="sw-drop-school" *ngIf="context?.school as school">
    <img class="sw-school-logo" *ngIf="school.logoUrl" [src]="school.logoUrl" [alt]="school.name" />
    <div class="sw-school-logo" *ngIf="!school.logoUrl">{{ school.initials }}</div>
    <div>
      <div class="sw-school-name">{{ school.name }}</div>
      <div class="sw-school-meta">{{ school.meta }}</div>
    </div>
  </div>
  <button type="button" class="sw-drop-item"><i class="ti ti-user"></i>My Profile</button>
  <button type="button" class="sw-drop-item" *ngIf="context?.role === 'admin'">
    <i class="ti ti-settings"></i>School Settings
  </button>
  <button type="button" class="sw-drop-item" (click)="loggedOut.emit()">
    <i class="ti ti-logout"></i>Logout
  </button>
</div>
