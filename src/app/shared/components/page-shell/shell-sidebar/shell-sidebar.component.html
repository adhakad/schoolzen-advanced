<div class="sb-wrap">
  <ng-container *ngFor="let group of groups; trackBy: trackByKey">

    <!-- Single item (Dashboard, Approvals) -->
    <a *ngIf="group.route" class="sb-item single"
       [class.parent-active]="activeRoute === group.route"
       [routerLink]="group.route" (click)="onNavigate()">
      <span class="sb-item-left"><i class="ti ti-{{ group.icon }}"></i><span>{{ group.label }}</span></span>
    </a>

    <!-- Collapsible module group -->
    <div class="sb-group" *ngIf="!group.route" [class.open]="openGroupKey === group.key">
      <button type="button" class="sb-item"
              [class.parent-active]="activeGroupKey === group.key"
              [attr.aria-expanded]="openGroupKey === group.key"
              (click)="toggleGroup(group.key)">
        <span class="sb-item-left"><i class="ti ti-{{ group.icon }}"></i><span>{{ group.label }}</span></span>
        <i class="ti ti-chevron-right chev"></i>
      </button>

      <div class="sb-sub-wrap">
        <div class="sb-sub-line"></div>
        <ng-container *ngFor="let item of group.items; trackBy: trackByRoute">
          <!-- Permission granted: a real link. -->
          <a *ngIf="!item.locked" class="sb-sub-item"
             [class.active-sub]="activeRoute === item.route"
             [routerLink]="item.route" (click)="onNavigate()">
            <i class="ti ti-point"></i>{{ item.label }}
          </a>
          <!-- Permission missing: visible but locked — no link, no click handler. -->
          <span *ngIf="item.locked" class="sb-sub-item locked"
                [attr.aria-disabled]="true" [title]="item.label + ' — no access'">
            <i class="ti ti-lock"></i>{{ item.label }}
          </span>
        </ng-container>
      </div>
    </div>

  </ng-container>
</div>
