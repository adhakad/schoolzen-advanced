<!-- The reference's `.confirm-overlay` markup, class-for-class:
     docs/schoolzen-planning/v1/academic-setup/classes-sections.html. Nothing renders until
     `open` — no hidden modal DOM sitting under a page full of action buttons. -->
<div class="sz-confirm-overlay open" *ngIf="open" (click)="onCancel()">
  <div class="confirm-modal" (click)="$event.stopPropagation()">
    <div class="confirm-head">
      <div class="confirm-icon" [class.neutral]="config.variant !== 'warning'">
        <i class="bi bi-exclamation-triangle"></i>
      </div>
      <div>
        <div class="confirm-title">{{ config.title }}</div>
        <div class="confirm-body-text">{{ config.message }}</div>
        <div class="confirm-scope" *ngIf="config.scopeNote">{{ config.scopeNote }}</div>
      </div>
    </div>

    <div class="confirm-body" *ngIf="config.typeToConfirm">
      <input id="confirm-word" type="text" autocomplete="off"
             [placeholder]="'Type ' + config.typeToConfirm + ' to confirm'"
             [attr.aria-label]="'Type ' + config.typeToConfirm + ' to confirm'"
             [(ngModel)]="typed" />
      <div class="confirm-hint">
        Type <b>{{ config.typeToConfirm }}</b> in the box above to enable the button.
      </div>
    </div>

    <div class="confirm-foot">
      <button type="button" class="confirm-cancel" (click)="onCancel()">
        {{ config.cancelLabel || 'Cancel' }}
      </button>
      <button type="button" class="confirm-delete"
              [class.neutral]="config.variant !== 'warning'"
              [disabled]="confirmDisabled"
              (click)="onConfirm()">
        {{ config.confirmLabel }}
      </button>
    </div>
  </div>
</div>
