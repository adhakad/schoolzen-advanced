<div class="dd" [class.open]="open">
  <div #trigger class="month-nav dd-trigger" role="button" tabindex="0" [attr.aria-expanded]="open"
       aria-label="Choose month" (click)="toggle($event)" (keydown.enter)="toggle($event)">
    <i class="bi bi-chevron-left" role="button" aria-label="Previous month" (click)="step($event, -1)"></i>
    <span class="dd-label">{{ label }}</span>
    <i class="bi bi-chevron-right" role="button" aria-label="Next month" (click)="step($event, 1)"></i>
  </div>
  <!-- Portaled to <body> while open, directly below the trigger (global rule 1). -->
  <div #menu class="dd-menu align-left cal-menu" [class.cal-menu-wide]="wide" (click)="$event.stopPropagation()">
    <ng-content select="[monthNavHead]"></ng-content>
    <div class="range-cal-head">
      <button type="button" class="range-cal-nav" aria-label="Previous month" (click)="step($event, -1)"><i class="bi bi-chevron-left"></i></button>
      <span class="range-cal-title">{{ title }}</span>
      <button type="button" class="range-cal-nav" aria-label="Next month" (click)="step($event, 1)"><i class="bi bi-chevron-right"></i></button>
    </div>
    <div class="range-cal" [class.has-marks]="marks">
      <div class="range-cal-dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
      <div class="range-cal-grid">
        <div *ngFor="let cell of days; trackBy: trackByIndex" [class]="cell.cls" [attr.title]="cell.names">
          <span class="range-day-num" *ngIf="cell.day">{{ cell.day }}</span>
        </div>
      </div>
    </div>
    <button type="button" class="change-dates-link" *ngIf="showAllLabel" (click)="showAll()">{{ showAllLabel }}</button>
  </div>
</div>
