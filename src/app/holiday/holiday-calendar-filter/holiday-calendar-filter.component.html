<div class="hcf">
  <div class="month-nav" role="button" tabindex="0" [attr.aria-expanded]="open" aria-label="Filter by month"
       (click)="toggle()" (keydown.enter)="toggle()">
    <i class="bi bi-chevron-left" role="button" aria-label="Previous month" (click)="step(-1, $event)"></i>
    <span class="hcf-label">{{ label }}</span>
    <i class="bi bi-chevron-right" role="button" aria-label="Next month" (click)="step(1, $event)"></i>
  </div>

  <div class="hcf-pop" *ngIf="open" (click)="$event.stopPropagation()">
    <div class="cal-legend" *ngIf="monthHolidays.length; else noneThisMonth">
      <span class="cal-legend-chip" *ngFor="let row of monthHolidays; trackBy: trackByHoliday">{{ chipLabel(row) }}</span>
    </div>
    <ng-template #noneThisMonth><div class="hcf-none">No holidays this month.</div></ng-template>

    <div class="range-cal-head">
      <button type="button" class="range-cal-nav" aria-label="Previous month" (click)="step(-1)"><i class="bi bi-chevron-left"></i></button>
      <span class="range-cal-title">{{ viewTitle }}</span>
      <button type="button" class="range-cal-nav" aria-label="Next month" (click)="step(1)"><i class="bi bi-chevron-right"></i></button>
    </div>
    <div class="range-cal-dow"><span *ngFor="let d of dow">{{ d }}</span></div>
    <div class="range-cal-grid">
      <div class="range-day" *ngFor="let cell of cells; trackBy: trackByCell"
           [class.in-range]="cell.inRange" [class.band-l]="cell.bandLeft" [class.band-r]="cell.bandRight"
           [class.chain-endpoint]="cell.endpoint"
           [attr.title]="cell.names || null">
        <span class="range-day-num" *ngIf="cell.day">{{ cell.day }}</span>
      </div>
    </div>
    <button type="button" class="change-dates-link" (click)="showAll()">Show all months</button>
  </div>
</div>
